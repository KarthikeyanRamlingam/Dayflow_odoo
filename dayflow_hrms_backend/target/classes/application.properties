spring.application.name=dayflow-hrms
server.port=${SERVER_PORT:8080}


# Default profile uses H2 for local development/tests. PostgreSQL can be configured via env vars in deployment.
spring.datasource.url=${DAYFLOW_DB_URL:jdbc:h2:mem:dayflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DAYFLOW_DB_USERNAME:sa}
spring.datasource.password=${DAYFLOW_DB_PASSWORD:}
spring.datasource.driver-class-name=${DAYFLOW_DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DAYFLOW_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=${JWT_SECRET:dayflow-super-secret-key-for-local-dev-change-me-dayflow-hrms-key-at-least-256-bits}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.security.user.name=admin
spring.security.user.password=admin

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false
dayflow.bootstrap-admin.username=${DAYFLOW_ADMIN_USERNAME:admin}
dayflow.bootstrap-admin.password=${DAYFLOW_ADMIN_PASSWORD:dayflow123}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method

# Spring Mail (defaults for local dev/testing)
spring.mail.host=${DAYFLOW_MAIL_HOST:localhost}
spring.mail.port=${DAYFLOW_MAIL_PORT:1025}
spring.mail.username=${DAYFLOW_MAIL_USERNAME:}
spring.mail.password=${DAYFLOW_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
