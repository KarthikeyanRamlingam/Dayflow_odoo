spring.application.name=dayflow-hrms
server.port=${SERVER_PORT:8080}

# Default profile uses H2 for local development/tests. PostgreSQL can be configured via env vars in deployment.
spring.datasource.url=${DAYFLOW_DB_URL:jdbc:h2:mem:dayflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DAYFLOW_DB_USERNAME:sa}
spring.datasource.password=${DAYFLOW_DB_PASSWORD:}
spring.datasource.driver-class-name=${DAYFLOW_DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=${JWT_SECRET:dayflow-super-secret-key-for-local-dev-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.security.user.name=admin
spring.security.user.password=admin

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
